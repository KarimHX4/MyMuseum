name: APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install

      - name: Projet Android (Capacitor)
        run: |
          node scripts/build-web.mjs
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MyMuseum.apk

      - name: Vérification de la signature (même clé à chaque version)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs MyMuseum.apk | tee certs.txt
          EXPECTED=$(keytool -exportcert -keystore android-signing/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          grep -qi "SHA-256 digest: $EXPECTED" certs.txt || { echo "Signature inattendue : l'APK ne pourrait pas mettre à jour la version installée."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: MyMuseum-apk
          path: MyMuseum.apk

      - name: Publication dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MyMuseum 1.0.${{ github.run_number }}
          body: APK à installer sur Android. Ouvrez cette page depuis le téléphone et touchez MyMuseum.apk.
          files: MyMuseum.apk
          make_latest: true
