name: APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install

      - name: Projet Android (Capacitor)
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Clé de signature stable (pour pouvoir mettre à jour sans désinstaller)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MyMuseum.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyMuseum-apk
          path: MyMuseum.apk

      - name: Publication dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MyMuseum 1.0.${{ github.run_number }}
          body: APK à installer sur Android. Ouvrez cette page depuis le téléphone et touchez MyMuseum.apk.
          files: MyMuseum.apk
          make_latest: true
